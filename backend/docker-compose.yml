# ────────────────────────────────────────────────────────────────────
# BIS SAHAYAK – Docker Compose
# ────────────────────────────────────────────────────────────────────
# Services:
#   postgres   – pgvector-enabled PostgreSQL 16
#   ollama     – Llama 3.2 3B (CPU-only by default)
#   ai_service – Python FastAPI (RAG + LLM orchestration)
#   backend    – TypeScript Express (business logic + REST API)
# ────────────────────────────────────────────────────────────────────

services:

  # ── 1. PostgreSQL with pgvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: saarthi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-business_saarthi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-business_saarthi}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── 2. Ollama (Llama 3.2 3B) ────────────────────────────────────
  # CPU-only. On a GPU EC2 instance (g4dn.xlarge), add:
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  ollama:
    image: ollama/ollama:latest
    container_name: saarthi-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama   # caches pulled models between restarts
    ports:
      - "11434:11434"              # expose for local debugging only; not needed in prod
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── 3. Python AI Microservice ────────────────────────────────────
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: saarthi-ai
    restart: unless-stopped
    environment:
      # Ollama – model names must match what we pull in wait_for_ollama()
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: llama3.2:3b
      EMBEDDING_MODEL: nomic-embed-text

      # Database – same instance as TypeScript backend
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/business_saarthi}

      # Internal auth – shared with TypeScript backend
      INTERNAL_SECRET: ${AI_SERVICE_SECRET}

      # CORS – only accept requests from the TS backend container
      BACKEND_ORIGIN: http://backend:3000

      # Generation tuning
      LLM_TEMPERATURE: "0.1"
      LLM_MAX_TOKENS: "2048"
      LLM_TIMEOUT: "120"

      LOG_LEVEL: info
    ports:
      - "8000:8000"               # expose for local debugging; lock down in prod
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s            # extra time for model pull on first boot

  # ── 4. TypeScript Express Backend ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saarthi-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/business_saarthi}

      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      COOKIE_SECRET: ${COOKIE_SECRET}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN}

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100

      # Python AI service
      AI_SERVICE_URL: http://ai_service:8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET}
      AI_SERVICE_TIMEOUT_MS: 120000

      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai_service:
        condition: service_healthy   # wait until Python + Ollama + models are ready

volumes:
  postgres_data:
  ollama_data:    # persist model weights – avoids re-download on every deploy